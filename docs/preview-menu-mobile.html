body { margin: 0; background: var(--color-bg-subtle); overflow-x: hidden; }
.switcher { position: sticky; top: 0; z-index: 500; display: flex; gap: var(--space-2); padding: var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }

.nav-float .item { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 62px; padding: var(--space-2) 0; border-radius: var(--radius-full); color: var(--color-neutral-400); position: relative; z-index: 1; cursor: pointer; }

/* Indicador animado atrás do item ativo (mesma mecânica de cálculo de
   posição/largura do marcador do BounceSidebar, ver
   src/app/(app)/bounce-sidebar.tsx - aqui em JS puro, sem framework).
   Só transform/width se movem (por isso top/bottom fixos = o padding do
   .bar, pra ocupar exatamente a altura dos itens sem precisar medir).
   Sem o efeito de vidro/frost do GlassIconBar original - só o
   "estica e assenta" do indicador. */
.gnav-ind {
  position: absolute;
  top: var(--space-2);
  bottom: var(--space-2);
  left: 0;
  width: 0;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  transform: translateX(0);
  pointer-events: none;
  z-index: 0;
}
.gnav-ind[data-phase="stretch"] {
  transition:
    transform 222ms cubic-bezier(0.32, 0.72, 0.24, 1),
    width 222ms cubic-bezier(0.32, 0.72, 0.24, 1);
}
.gnav-ind[data-phase="settle"] {
  transition:
    transform 491ms cubic-bezier(0.28, 1.358, 0.36, 1),
    width 491ms cubic-bezier(0.24, 1.435, 0.38, 1);
}
.gnav-ind[data-phase="idle"] { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .gnav-ind { transition: none !important; }
}
.nav-rail { display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 60px; background: var(--color-dark-bg); flex-direction: column; align-items: center; padding-top: var(--space-8); gap: var(--space-3); z-index: 400; }
.nav-rail .item { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 44px; padding: var(--space-2) 0; border-radius: var(--radius-md); color: rgba(255,255,255,0.55); }

.nav-rail .item span { font-size: 9px; font-weight: var(--weight-medium); }
.nav-rail .item.is-active { background: var(--color-primary); color: #fff; }
body[data-menu="rail"] .phone { padding-left: 60px; }
.nav-grid-trigger { display: none; position: fixed; top: 18px; left: 18px; z-index: 450; width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--color-dark-bg); color: #fff; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); }

.nav-grid-overlay.is-open { display: block; }
.nav-grid-overlay .close { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: var(--radius-full); background: rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; }
.nav-grid-overlay .close svg { width: 18px; height: 18px; }
.nav-grid-overlay .title { color: rgba(255,255,255,0.5); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .06em; margin: var(--space-8) 0 var(--space-5); }
.nav-grid-overlay .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.nav-grid-overlay .item { display: flex; flex-direction: column; gap: var(--space-3); background: rgba(255,255,255,0.06); border-radius: var(--radius-xl); padding: var(--space-6) var(--space-5); color: #fff; }
.nav-grid-overlay .item.is-active { background: var(--color-primary); }
.nav-grid-overlay .item svg { width: 24px; height: 24px; }
.nav-grid-overlay .item span { font-family: var(--font-body); font-weight: var(--weight-medium); font-size: var(--text-sm); }
body[data-menu="float"] .nav-float { display: flex; }
body[data-menu="rail"] .nav-rail { display: flex; }
body[data-menu="grid"] .nav-grid-trigger { display: flex; }
</style>

<script>
function setMenu(name, btn) {
  document.body.setAttribute('data-menu', name);
  document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  document.getElementById('gridOverlay').classList.remove('is-open');
  if (name === 'float') snapFloatIndicator();
}

// Indicador animado da opção A (nav-float): ao trocar de item, o
// indicador estica pra cobrir a posição de origem e a de destino (fase
// "stretch"), depois contrai sobre o alvo com um leve exagero (fase
// "settle"). A ideia de calcular a posição/largura pelo item ativo é a
// mesma do marcador do BounceSidebar (desktop,
// src/app/(app)/bounce-sidebar.tsx) - aqui em JS puro, sem framework,
// porque este preview não carrega nenhum.
const floatBar = document.querySelector('.nav-float .bar');
const floatInd = floatBar.querySelector('.gnav-ind');
const floatItems = Array.from(floatBar.querySelectorAll('.item'));
let floatActive = Math.max(0, floatItems.findIndex((el) => el.classList.contains('is-active')));
let floatStretchTimer = null;
let floatSettleTimer = null;

function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// Posição/largura do item, relativas ao .bar (que é o offsetParent, por
// ter position:relative) - nunca muda de pixel a não ser que o layout
// mude, já que os itens têm largura fixa.
function floatItemRect(item) {
  return { left: item.offsetLeft, width: item.offsetWidth };
}

// Posição/largura ATUAIS do indicador (não do item), medidas do layout -
// funciona mesmo no meio de uma transição, o que importa se um clique
// novo interromper a animação anterior (a fase "stretch" parte de onde o
// indicador está de verdade, não de onde ele "deveria" estar parado).
function floatIndicatorRect() {
  const barBox = floatBar.getBoundingClientRect();
  const indBox = floatInd.getBoundingClientRect();
  return { left: indBox.left - barBox.left, width: indBox.width };
}

function paintFloatIndicator(rect) {
  floatInd.style.transform = `translateX(${rect.left}px)`;
  floatInd.style.width = `${rect.width}px`;
}

// Força o navegador a computar o estilo atual antes da próxima mudança.
// Sem isso, trocar data-phase (que troca a regra de transition) e pintar
// o novo valor no mesmo tick vira uma atualização atômica sem transição
// visível - o browser nunca chega a "commitar" o estado anterior como
// ponto de partida.
function forceReflow(el) {
  void el.offsetWidth;
}

function snapFloatIndicator() {
  floatInd.dataset.phase = 'idle';
  paintFloatIndicator(floatItemRect(floatItems[floatActive]));
}

function selectFloatItem(index) {
  if (index === floatActive) return;
  clearTimeout(floatStretchTimer);
  clearTimeout(floatSettleTimer);

  const from = floatIndicatorRect();
  floatItems[floatActive].classList.remove('is-active');
  floatActive = index;
  floatItems[floatActive].classList.add('is-active');
  const to = floatItemRect(floatItems[floatActive]);

  if (prefersReducedMotion()) {
    snapFloatIndicator();
    return;
  }

  const left = Math.min(from.left, to.left);
  const right = Math.max(from.left + from.width, to.left + to.width);
  floatInd.dataset.phase = 'stretch';
  forceReflow(floatInd);
  paintFloatIndicator({ left, width: right - left });

  floatStretchTimer = setTimeout(() => {
    floatInd.dataset.phase = 'settle';
    forceReflow(floatInd);
    paintFloatIndicator(to);
    floatSettleTimer = setTimeout(() => {
      floatInd.dataset.phase = 'idle';
    }, 491);
  }, 222);
}

snapFloatIndicator();
window.addEventListener('resize', snapFloatIndicator);
</script>
